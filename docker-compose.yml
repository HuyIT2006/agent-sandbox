services:
  # 1. Dịch vụ Lõi: Sandbox API Gateway & Execution Engine
  sandbox-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_sandbox_gateway
    privileged: true # Cần thiết để bwrap tạo user/mount/pid namespaces bên trong container
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      - REDIS_URL=redis://sandbox-redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      - sandbox-redis
    restart: unless-stopped

  # 2. Dịch vụ Phụ trợ: Redis lưu trữ trạng thái Session & Rate Limiting
  sandbox-redis:
    image: redis:7-alpine
    container_name: agent_sandbox_redis
    ports:
      - "6380:6379" # Dùng port 6380 trên host để tránh xung đột
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
